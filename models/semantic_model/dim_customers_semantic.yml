models:
  - name: dim_customers
    semantic_model:
      enabled: true
      name: dim_customers
    description: Customer dimension
    agg_time_dimension: signup_date
    columns:
      - name: customer_id
        entity:
          type: primary
          name: customer
      - name: customer_name
        dimension:
          type: categorical
      - name: email
        dimension:
          type: categorical
      - name: plan_tier
        dimension:
          type: categorical
      - name: country_code
        dimension:
          type: categorical
      - name: signup_date
        dimension:
          type: time
        granularity: day
      - name: first_order_date
        dimension:
          type: time
        granularity: day
      - name: most_recent_order_date
        dimension:
          type: time
        granularity: day
    metrics:
      - name: lifetime_orders
        description: Total lifetime orders across all customers
        type: simple
        label: Total Lifetime Orders
        agg: sum
      - name: lifetime_successful_revenue_usd
        description: Total lifetime successful revenue across all customers
        type: simple
        label: Total Lifetime Successful Revenue
        agg: sum