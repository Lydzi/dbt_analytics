semantic_models:
  - name: daily_revenue
    model: ref('fct_daily_revenue')
    description: Daily revenue fact

    defaults:
      agg_time_dimension: order_date

    entities:
      - name: order_dt
        type: primary
        expr: order_date

    dimensions:

      - name: order_date
        type: time
        type_params:
          time_granularity: day

    measures:

      - name: total_orders
        description: Total number of orders
        agg: sum

      - name: successful_revenue
        description: Successful revenue
        expr: successful_revenue_usd
        agg: sum

      - name: refunded_amount
        description: Refunded amount
        expr: refunded_amount_usd
        agg: sum

      - name: failed_amount
        description: Failed payment amount
        expr: failed_amount_usd
        agg: sum